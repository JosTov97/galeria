<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Editar Recuerdo</title>
    <style>
        body {
            font-family: 'Georgia', serif;
            background: linear-gradient(135deg, #ffeef8 0%, #ffe0ec 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .form-container {
            background: white;
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 15px 35px rgba(214, 51, 132, 0.2);
            max-width: 500px;
            width: 100%;
        }

        h2 {
            color: #d63384;
            text-align: center;
            margin-bottom: 30px;
            font-size: 2em;
        }

        .foto-actual {
            text-align: center;
            margin-bottom: 20px;
        }

        .foto-actual img {
            max-width: 100%;
            max-height: 200px;
            border-radius: 10px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            color: #5a3d44;
            margin-bottom: 8px;
            font-weight: bold;
        }

        input, textarea, select {
            width: 100%;
            padding: 12px;
            border: 2px solid #ffe0ec;
            border-radius: 10px;
            font-family: inherit;
            font-size: 1em;
            transition: border-color 0.3s;
        }

        input:focus, textarea:focus, select:focus {
            outline: none;
            border-color: #d63384;
        }

        textarea {
            resize: vertical;
            min-height: 80px;
        }

        .checkbox-group {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .checkbox-group input[type="checkbox"] {
            width: auto;
            transform: scale(1.5);
        }

        button {
            width: 100%;
            padding: 15px;
            background: linear-gradient(135deg, #d63384 0%, #b52a6f 100%);
            color: white;
            border: none;
            border-radius: 25px;
            font-size: 1.1em;
            cursor: pointer;
            transition: transform 0.3s, box-shadow 0.3s;
            margin-bottom: 10px;
        }

        button:hover {
            transform: translateY(-3px);
            box-shadow: 0 10px 20px rgba(214, 51, 132, 0.3);
        }

        .btn-cancelar {
            background: #6c757d;
            text-decoration: none;
            display: block;
            text-align: center;
            padding: 15px;
            color: white;
            border-radius: 25px;
        }

        .info {
            color: #666;
            font-size: 0.9em;
            margin-top: 5px;
        }
    </style>
</head>
<body>
<div class="form-container">
    <h2>✏️ Editar Recuerdo</h2>

    <div class="foto-actual">
        <img th:src="@{/uploads/{nombre}(nombre=${foto.archivoNombre})}"
             th:alt="${foto.titulo}">
        <p style="color: #666; font-size: 0.9em; margin-top: 10px;">Foto actual</p>
    </div>

    <form th:action="@{/editar/{id}(id=${foto.id})}" method="post" enctype="multipart/form-data">
        <div class="form-group">
            <label for="titulo">Título:</label>
            <input type="text" id="titulo" name="titulo"
                   th:value="${foto.titulo}" required>
        </div>

        <div class="form-group">
            <label for="descripcion">Descripción:</label>
            <textarea id="descripcion" name="descripcion"
                      th:text="${foto.descripcion}"></textarea>
        </div>

        <div class="form-group">
            <label for="categoria">Categoría:</label>
            <select id="categoria" name="categoria" required>
                <option value="momentos-especiales" th:selected="${foto.categoria == 'momentos-especiales'}">Momentos Especiales</option>
                <option value="vacaciones" th:selected="${foto.categoria == 'vacaciones'}">Vacaciones</option>
                <option value="citas" th:selected="${foto.categoria == 'citas'}">Citas</option>
                <option value="familia" th:selected="${foto.categoria == 'familia'}">Familia</option>
                <option value="otros" th:selected="${foto.categoria == 'otros'}">Otros</option>
            </select>
        </div>

        <div class="form-group">
            <label for="nuevaFoto">Cambiar foto (opcional):</label>
            <input type="file" id="nuevaFoto" name="nuevaFoto" accept="image/*">
            <p class="info">Deja vacío si quieres mantener la foto actual</p>
        </div>

        <button type="submit">💾 Guardar Cambios</button>
    </form>

    <a href="/" class="btn-cancelar">← Cancelar y volver</a>
</div>
</body>
</html>
