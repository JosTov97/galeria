<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel de Amor</title>
    <style>
        body {
            font-family: 'Georgia', serif;
            background: linear-gradient(135deg, #ffeef8 0%, #ffe0ec 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .form-container {
            background: white;
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 15px 35px rgba(214, 51, 132, 0.2);
            max-width: 500px;
            width: 100%;
        }

        h2 {
            color: #d63384;
            text-align: center;
            margin-bottom: 30px;
            font-size: 2em;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            color: #5a3d44;
            margin-bottom: 8px;
            font-weight: bold;
        }

        input, textarea, select {
            width: 100%;
            padding: 12px;
            border: 2px solid #ffe0ec;
            border-radius: 10px;
            font-family: inherit;
            font-size: 1em;
            transition: border-color 0.3s;
        }

        input:focus, textarea:focus, select:focus {
            outline: none;
            border-color: #d63384;
        }

        textarea {
            resize: vertical;
            min-height: 80px;
        }

        button {
            width: 100%;
            padding: 15px;
            background: linear-gradient(135deg, #d63384 0%, #b52a6f 100%);
            color: white;
            border: none;
            border-radius: 25px;
            font-size: 1.1em;
            cursor: pointer;
            transition: transform 0.3s, box-shadow 0.3s;
        }

        button:hover {
            transform: translateY(-3px);
            box-shadow: 0 10px 20px rgba(214, 51, 132, 0.3);
        }

        .mensaje {
            text-align: center;
            padding: 15px;
            border-radius: 10px;
            margin-bottom: 20px;
        }

        .exito {
            background: #d4edda;
            color: #155724;
        }

        .error {
            background: #f8d7da;
            color: #721c24;
        }

        .volver {
            display: block;
            text-align: center;
            margin-top: 20px;
            color: #d63384;
            text-decoration: none;
        }
    </style>
</head>
<body>
<div class="form-container">
    <h2>✨ Subir Nuevo Recuerdo ✨</h2>

    <div th:if="${mensaje}" class="mensaje exito" th:text="${mensaje}"></div>
    <div th:if="${error}" class="mensaje error" th:text="${error}"></div>

    <form th:action="@{/subir}" method="post" enctype="multipart/form-data">
        <div class="form-group">
            <label for="titulo">Título del momento:</label>
            <input type="text" id="titulo" name="titulo" required
                   placeholder="Ej: Nuestro primer viaje juntos">
        </div>

        <div class="form-group">
            <label for="descripcion">Descripción:</label>
            <textarea id="descripcion" name="descripcion"
                      placeholder="Cuéntame qué hizo especial este momento..."></textarea>
        </div>

        <div class="form-group">
            <label for="categoria">Categoría:</label>
            <select id="categoria" name="categoria" required>
                <option value="momentos-especiales">Momentos Especiales</option>
                <option value="vacaciones">Vacaciones</option>
                <option value="citas">Citas</option>
                <option value="familia">Familia</option>
                <option value="otros">Otros</option>
            </select>
        </div>

        <div class="form-group">
            <label for="fechaCaptura">Fecha de la foto:</label>
            <input type="date" id="fechaCaptura" name="fechaCaptura">
        </div>

        <div class="form-group">
            <label for="archivo">Seleccionar foto:</label>
            <input type="file" id="archivo" name="archivo" accept="image/*" required>
        </div>

        <button type="submit">💕 Guardar Recuerdo</button>
    </form>

    <a href="/" class="volver">← Volver a la galería</a>
</div>
</body>
</html>
